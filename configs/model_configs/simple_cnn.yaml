# Simple CNN Configuration
model:
  name: "simple_cnn"
  type: "deep"

  architecture:
    in_channels: 1
    channels: [16, 32, 64, 128]
    kernel_sizes: [3, 3, 3, 3]
    pool_sizes: [2, 2, 2, 2]
    fc_hidden: 128
    num_classes: 2
    dropout: 0.3
    batch_norm: true
    activation: "relu"

  training:
    batch_size: 96
    epochs: 12
    learning_rate: 1.0e-3
    weight_decay: 1.0e-4
    optimizer: "adam"
    scheduler: "cosine"
    patience: 2

  input:
    feature_type: "mel_spectrogram"
    n_mels: 80
