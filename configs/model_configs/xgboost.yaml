# XGBoost Configuration
model:
  name: "xgboost"
  type: "classical"
  
  params:
    n_estimators: 150
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    gamma: 0.1
    reg_alpha: 0.1
    reg_lambda: 1.0
    scale_pos_weight: "auto"
    eval_metric: "logloss"
    tree_method: "hist"
    device: "cpu"
    early_stopping_rounds: 20
    random_state: 42

  input:
    feature_type: "mfcc"
    feature_dim: 240
