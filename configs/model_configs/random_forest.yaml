# Random Forest Configuration
model:
  name: "random_forest"
  type: "classical"
  
  params:
    n_estimators: 150
    max_depth: 20
    min_samples_split: 5
    min_samples_leaf: 2
    max_features: "sqrt"
    class_weight: "balanced"
    n_jobs: -1
    random_state: 42

  input:
    feature_type: "mfcc"
    feature_dim: 240
